[package]
name = "karzoun-ironroute"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Adaptive edge gateway with health-aware routing, circuit breaking, rate limiting, request signing and load shedding."
license = "Apache-2.0"
repository = "https://github.com/mkarson1997/karzoun-ironroute"
keywords = ["gateway", "proxy", "resilience", "security", "rust"]
categories = ["network-programming", "web-programming::http-server"]
publish = false

[dependencies]
axum = { version = "0.8", features = ["http1", "http2", "tokio"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
hmac = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
