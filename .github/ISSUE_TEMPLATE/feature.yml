name: Feature request
description: Propose a scoped gateway or resilience capability
title: "feat: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Production problem
      description: What concrete networking, resilience, security or operability problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe observable behavior and failure semantics, not only an implementation choice.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs and compatibility
      description: Note security, latency, memory, compatibility or configuration implications.
    validations:
      required: true
