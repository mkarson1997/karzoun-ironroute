name: Temporary Rust Bootstrap

on:
  push:
    branches: [feat/v0.1-adaptive-edge-core]

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt && rustup override set 1.98.1
      - name: Format and lock dependencies
        run: |
          cargo fmt --all
          cargo generate-lockfile
      - name: Commit generated artifacts
        run: |
          if git diff --quiet && git status --porcelain | grep -q '^?? Cargo.lock$' == false; then
            echo 'No bootstrap changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock src Cargo.toml
          git commit -m 'chore: format Rust sources and lock dependencies'
          git push
