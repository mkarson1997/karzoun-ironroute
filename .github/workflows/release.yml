name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Dockerfile'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  validate:
    name: Release validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal && rustup override set 1.98.1
      - name: Build locked release binary
        run: cargo build --release --locked
      - name: Build production container
        run: docker build --build-arg VERSION=pr-validation -t ironroute:pr-validation .

  bootstrap-v0-1-0:
    name: Bootstrap v0.1.0 tag
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'prepare IronRoute v0.1.0 release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create release tag exactly once
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 already exists.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v0.1.0 -m 'Karzoun IronRoute v0.1.0'
          git push origin v0.1.0

  build:
    name: Release binary (${{ matrix.os }})
    needs: [bootstrap-v0-1-0]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'prepare IronRoute v0.1.0 release')))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
      - name: Install Rust 1.98.1
        shell: bash
        run: rustup toolchain install 1.98.1 --profile minimal && rustup override set 1.98.1
      - name: Build and stage native binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION='0.1.0'
          fi
          cargo build --release --locked
          TARGET="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p dist
          if [[ "${RUNNER_OS}" == 'Windows' ]]; then
            cp target/release/karzoun-ironroute.exe "dist/ironroute-${VERSION}-${TARGET}.exe"
          else
            cp target/release/karzoun-ironroute "dist/ironroute-${VERSION}-${TARGET}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release and GHCR image
    needs: [bootstrap-v0-1-0, build]
    if: always() && needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'prepare IronRoute v0.1.0 release')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.0' }}
      - uses: actions/download-artifact@v5
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Resolve release version
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            REF="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            REF='v0.1.0'
            VERSION='0.1.0'
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum ironroute-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ steps.vars.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_REF" >/dev/null 2>&1; then
            gh release upload "$RELEASE_REF" dist/* --clobber
          else
            gh release create "$RELEASE_REF" dist/* --verify-tag --title "Karzoun IronRoute ${RELEASE_REF}" --generate-notes
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish container with SBOM and provenance
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          sbom: true
          provenance: mode=max
